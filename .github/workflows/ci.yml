name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Cek tipe
        run: bun run lint
      - name: Tes
        run: bun run test
      - name: Build
        run: bun run build
